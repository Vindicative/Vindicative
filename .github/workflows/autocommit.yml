name: auto commit

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update date file
        run: TZ=Asia/Riyadh date +"%Y-%m-%d" > .github/.last-update

      - name: Commit and push
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add .github/.last-update
          git commit --allow-empty -m "chore: update $(TZ=Asia/Riyadh date +%Y-%m-%d)"
          git pull --rebase
          git push
